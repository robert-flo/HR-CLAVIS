# Datos del proyecto. Es el único archivo de datos que llenás a mano; después: ./pj
# Lo valida schema/proyecto.schema.json de pj-template. Los textos van entre comillas (un # sin comillas corta el valor).
proyecto: "HR-CLAVIS"           # nombre del trío: PM-<proyecto>, WK-<proyecto>, RV-<proyecto>
area: "home repo del ecosistema PJ-CLAVIS — punto único de entrada del trío a todos sus repos"
rama_base: "master"             # rama de los PR finales
template_ref: "4720a67434d1510385dfc735ba262ec462150412"   # SHA de robert-flo/pj-template; lo sube el PR de sync
# Repos hijos. dir = carpeta local, ignorada en .gitignore. Se llenan en el onboarding del PM.
repos:
  - dir: "PJ-NIRI-rf-omarchy-workstation"
    repo: "robert-flo/PJ-NIRI-rf-omarchy-workstation"
    rama: "master"
    nota: "workstation (Vault de arquitectura, ADRs, workflows y proyectos)"
  - dir: "rf-dotfiles"
    repo: "robert-flo/rf-dotfiles"
    rama: "master"
    nota: "dotfiles (Chezmoi SSoT y `packages.json` para `niri`, `niri-classic`, `omarchy`)"
#  - dir: "rf-ejemplo"
#    repo: "robert-flo/ejemplo"
#    rama: "master"
#    nota: "qué es este repo en una frase"
# Specs en curso: ref = dueño/repo#N, orden entero, exactamente uno con primero: true.
specs: []
notas: |
  Home repo (Home Repo Pattern de aihero) del ecosistema PJ-CLAVIS: workstation, dotfiles, forkhub,
  workflows. El PM de acá es la única puerta de entrada y opera sobre todos los repos que se
  clonan adentro (repos:, los llena ./pj onboard). Rama por defecto master (nunca main), nada
  directo a master: rama auxiliar o worktree, PR, rebase, merge y limpiar rama. Regla propia: los
  commits van sin trailers Co-authored-by ni atribución a agentes.
  Nunca PRs hacia StatIndet. La única puerta a / es pacman vía [omarchy-personal].
# Archivos propios a mano que pj-template conserva sin tocar.
extras:
  - "CLAUDE.md"
  - "HR-CLAVIS.code-workspace"
  - "docs/agents/issue-tracker.md"
  - "docs/agents/triage-labels.md"
  - "docs/agents/domain.md"
# Skills extra por rol, además de plantillas/roles.yml de pj-template.
skills_extra: {}
